name: Android Advanced PDF test APK

on:
  push:
    branches:
      - draft/android-advanced-pdf-tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android Flutter runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Install packages
        run: flutter pub get
      - name: Analyze sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build installable Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-pr4-android-testing-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
