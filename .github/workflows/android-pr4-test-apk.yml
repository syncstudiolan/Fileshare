name: Android Advanced PDF test APK

on:
  push:
    branches:
      - draft/android-advanced-pdf-tools
      - fix/photo-enhancement-crop-signature-visual-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android Flutter runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Generate branded Android launcher resources
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_brand_assets.py
      - name: Install packages
        run: flutter pub get
      - name: Repair legacy WebView ProGuard for AGP 9
        run: python3 tool/fix_legacy_inappwebview_gradle.py
      - name: Analyze sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Compile native Kotlin LAN NSD and Android PDF Tools
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain
      - name: Build installable Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-pr4-android-testing-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
