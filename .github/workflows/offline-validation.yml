name: Validate File Share background LAN and compact releases

on:
  # Android test build on the explicitly requested merge into main.
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-apple-silicon-dmg.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping validations when multiple source fixes are pushed.
concurrency:
  group: fileshare-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview_validation:
    # Before merging PR #6, run actual analyzer/tests/Android compilation.
    # Release-authorized PR 16: validate once before merging to avoid failed releases.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner for plugin analyzer
        run: flutter create --project-name file_share --platforms=android .
      - name: Supply Maven Central fallback for Flutter Gradle included build
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/fileshare-maven-fallback.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          gradle.beforeProject { project ->
            project.buildscript.repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Generate final Android launcher logo assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_brand_assets.py
      - name: Verify ML Kit release rules
        run: python3 tool/ensure_mlkit_proguard.py
      - run: flutter pub get
      - name: Repair upstream WebView ProGuard configuration for AGP 9
        run: python3 tool/fix_legacy_inappwebview_gradle.py
      - name: Check existing Worker and automatic device-transfer schema
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/worker.js
          node --test cloudflare/device_receipt.test.mjs cloudflare/inbox_events.test.mjs cloudflare/guest_instant.test.mjs cloudflare/auto_cloud_midnight.test.mjs
          python3 - <<'PY'
          import sqlite3
          connection=sqlite3.connect(':memory:')
          script=open('cloudflare/schema.sql',encoding='utf8').read()
          connection.executescript(script)
          for table in ('device_transfers','device_transfer_parts','uploads','accounts'):
              assert connection.execute(
                  "SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",
                  (table,)).fetchone(),table
          print('Existing Cloudflare setup auto-installs device transfer tables.')
          PY
      - name: Analyze all Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Toolbox UI and image processing regression tests
        run: flutter test --reporter expanded --timeout 2m
      - name: Compile upstream native Android PDF Tools and scanner
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain
      - name: Verify the original 24-tool Kotlin registry on JVM
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build File Share Android PDF Tools test APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify test APK debug signature
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android PDF Tools test APK
        uses: actions/upload-artifact@v4
        with:
          name: file-share-pdf-tools-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ios-only]') && !contains(github.event.head_commit.message, '[mac-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing Android runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Generate final Android launcher logo assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_brand_assets.py
      - name: Supply Maven Central fallback for Flutter Gradle included build
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/fileshare-maven-fallback.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          gradle.beforeProject { project ->
            project.buildscript.repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Configure Android release ML Kit keep rules
        run: python3 tool/ensure_mlkit_proguard.py
      - name: Install packages
        run: flutter pub get
      - name: Repair upstream WebView ProGuard configuration for AGP 9
        run: python3 tool/fix_legacy_inappwebview_gradle.py
      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and LAN model tests
        run: flutter test --reporter expanded --timeout 2m
      - name: Central Directory contract tests
        run: node --test directory/worker.test.mjs
      - name: Live Cloudflare auth route smoke checks (no real credentials)
        shell: bash
        run: |
          set -euo pipefail
          directory='https://fileshare-directory.modeltech0.workers.dev'
          personal='https://fileshare-personal-7ee7299b34.modeltech0.workers.dev'
          for endpoint in "$directory" "$personal"; do
            curl --fail --show-error --silent --retry 3 --retry-delay 2 \
              "$endpoint/health" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d"
          done
          code=$(curl -sS -o /tmp/directory-unknown-email.json -w '%{http_code}' \
            -X POST "$directory/v1/directory/resolve" \
            -H 'content-type: application/json' \
            --data '{"email":"nonexistent-smoke-test-835293@example.invalid"}')
          test "$code" = 404 || { echo "Directory resolve returned unexpected HTTP $code"; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/directory-unknown-email.json')); assert d.get('error') == 'Email address is not registered', d"
      - name: Verify bundled Android native PDF Tools compile
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain
      - name: Verify native Kotlin PDF tool tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Package installable Android testing APK without production signing secrets
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-android-lan-tested-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Configure stable production APK signing
        shell: bash
        env:
          SIGNED_KEYSTORE: ${{ secrets.FILE_SHARE_ANDROID_KEYSTORE_BASE64 }}
          SIGNED_STORE_PASSWORD: ${{ secrets.FILE_SHARE_ANDROID_KEYSTORE_PASSWORD }}
          SIGNED_KEY_ALIAS: ${{ secrets.FILE_SHARE_ANDROID_KEY_ALIAS }}
          SIGNED_KEY_PASSWORD: ${{ secrets.FILE_SHARE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNED_KEYSTORE" || -z "$SIGNED_STORE_PASSWORD" || -z "$SIGNED_KEY_ALIAS" || -z "$SIGNED_KEY_PASSWORD" ]]; then
            echo "::error::Configure FILE_SHARE_ANDROID_KEYSTORE_BASE64, FILE_SHARE_ANDROID_KEYSTORE_PASSWORD, FILE_SHARE_ANDROID_KEY_ALIAS, FILE_SHARE_ANDROID_KEY_PASSWORD as repository Actions secrets; production builds cannot use debug keys."
            exit 1
          fi
          printf %s "$SIGNED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/file-share-production.jks"
          echo "FILE_SHARE_KEYSTORE_FILE=$RUNNER_TEMP/file-share-production.jks" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEYSTORE_PASSWORD=$SIGNED_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEY_ALIAS=$SIGNED_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEY_PASSWORD=$SIGNED_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build compact ARM64 production release APK
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          test -n "$version"
          flutter build apk --release --target-platform android-arm64 --build-name="$version" --build-number=${{ github.run_number }} --dart-define=FILE_SHARE_VERSION="$version" --dart-define=FILE_SHARE_BUILD_NUMBER=${{ github.run_number }} --obfuscate --split-debug-info=build/obfuscation-symbols --tree-shake-icons
      - name: Verify signing, installable package and ARM64-only native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          python3 - "$apk" <<'PY'
          import zipfile, sys, os
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              libraries=[n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis=sorted({n.split('/')[1] for n in libraries})
              print('Native ABIs:', abis)
              assert abis == ['arm64-v8a'], f'Unexpected ABIs: {abis}'
          size=os.path.getsize(apk)
          print(f'APK size: {size/1048576:.1f} MiB')
          assert size < 160*1048576, 'APK exceeds 160 MiB test limit'
          PY
          cp "$apk" build/app/outputs/flutter-apk/FileShare-Android-ARM64-Release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-android-signed-release-apk
          path: build/app/outputs/flutter-apk/FileShare-Android-ARM64-Release.apk
          if-no-files-found: error
      - name: Build special full-backend emulator-only debug APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --dart-define=FILE_SHARE_BACKGROUND_VALIDATION=true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: file-share-background-emulator-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    # Still produce the Windows installer if Android signing secrets are missing.
    # The needs edge serializes Windows after Android; no parallel release builds.
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[ios-only]') && !contains(github.event.head_commit.message, '[mac-only]'))))

    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - name: Generate missing Windows runner
        run: flutter create --project-name file_share --platforms=windows .
      - name: Generate and verify File Share Windows taskbar EXE icon
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python tool/generate_brand_assets.py
          python tool/fix_windows_taskbar.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded --timeout 2m
      - name: Supply ONNX Runtime native Windows files from official NuGet package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.28.0'
          $cmake = 'windows/CMakeLists.txt'
          $source = Get-Content $cmake -Raw
          $needle = 'include\(flutter/generated_plugins\.cmake\)'
          if ($source -notmatch $needle) { throw 'Windows CMake generated plugins include missing' }
          $source = $source -replace $needle, "set(ONNXRUNTIME_VERSION `"$version`")`ninclude(flutter/generated_plugins.cmake)"
          Set-Content -Path $cmake -Value $source
          $name = "onnxruntime-win-x64-$version"
          $root = Join-Path (Get-Location) "build/windows/x64/plugins/flutter_onnxruntime/onnxruntime/$name"
          $nuget = Join-Path $env:RUNNER_TEMP 'onnxruntime-nuget'
          New-Item -ItemType Directory -Force -Path $root,$nuget | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'onnxruntime.nupkg'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$version/microsoft.ml.onnxruntime.$version.nupkg"
          & curl.exe -fSL --retry 3 --retry-delay 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "NuGet ONNX Runtime download failed: $url" }
          Copy-Item $zip "$zip.zip"
          Expand-Archive -LiteralPath "$zip.zip" -DestinationPath $nuget -Force
          $headers = Get-ChildItem $nuget -Recurse -File -Filter onnxruntime_cxx_api.h | Select-Object -First 1
          $libraries = Get-ChildItem $nuget -Recurse -File -Filter onnxruntime.lib | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          $dlls = Get-ChildItem $nuget -Recurse -File -Filter onnxruntime.dll | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          if (-not $headers -or -not $libraries -or -not $dlls) {
            Get-ChildItem $nuget -Recurse -File | Where-Object { $_.Name -like '*onnxruntime*' } | Select-Object -ExpandProperty FullName
            throw 'NuGet package missing required x64 library, DLL or C++ headers'
          }
          New-Item -ItemType Directory -Force -Path "$root/include","$root/lib" | Out-Null
          Copy-Item (Join-Path $headers.DirectoryName '*') "$root/include" -Recurse -Force
          Copy-Item $libraries.FullName "$root/lib/onnxruntime.lib" -Force
          Copy-Item $dlls.FullName "$root/lib/onnxruntime.dll" -Force
          foreach ($required in @("$root/include/onnxruntime_cxx_api.h","$root/lib/onnxruntime.lib","$root/lib/onnxruntime.dll")) {
            if (-not (Test-Path $required)) { throw "ONNX dependency not ready: $required" }
          }
      - name: Build optimized Windows release bundle
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1) -replace '^version:\s*','').Split('+')[0]
          if (-not $version) { throw 'Missing app version' }
          flutter build windows --release "--dart-define=FILE_SHARE_VERSION=$version" "--dart-define=FILE_SHARE_BUILD_NUMBER=${{ github.run_number }}"
      - name: Record Windows release bundle size
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $bytes = (Get-ChildItem $bundle -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Windows release bundle size: $bytes bytes"
          Get-ChildItem $bundle -File | Select-Object Name,Length
      - name: Run real Windows EXE hidden and transfer a file by TCP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path "build/windows/x64/runner/Release").Path
          $exe = Join-Path $folder "file_share.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--lan-smoke", "--background" -WorkingDirectory $folder -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Windows EXE exited with code $($proc.ExitCode)" }
              $port = Get-NetTCPConnection -LocalPort 49311 -State Listen -ErrorAction SilentlyContinue
              if ($port) { $ready = $true; break }
            }
            if (-not $ready) { throw "Windows LAN TCP listener did not start" }
            $payload = "Windows background LAN transfer proof"
            $header = '{"protocol":"fileshare-file-v1","name":"windows_smoke.txt","size":' +
              [Text.Encoding]::UTF8.GetByteCount($payload) +
              ',"batch":"win-smoke","sender":"Windows GitHub CI","senderId":"windows-ci"}'
            $bytes = [Text.Encoding]::UTF8.GetBytes($header + [char]10 + $payload)
            $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", 49311)
            try {
              $client.ReceiveTimeout = 20000
              $stream = $client.GetStream()
              $stream.Write($bytes,0,$bytes.Length)
              $stream.Flush()
              $buffer = New-Object byte[] 64
              $read = $stream.Read($buffer,0,$buffer.Length)
              $ack = [Text.Encoding]::UTF8.GetString($buffer,0,$read)
              Write-Host "Real Windows LAN receiver ACK: $ack"
              if (-not $ack.StartsWith("OK")) { throw "Windows receiver did not persist the file" }
              $proc.Refresh()
              if ($proc.HasExited) { throw "Windows receiver exited instead of running in background" }
              Write-Host "PASS: Windows release EXE live in background and LAN TCP ACK received."
            } finally { $client.Dispose() }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installable Program Files setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1) -replace '^version:\s*','').Split('+')[0]
          & $iscc "/DMyAppVersion=$version.${{ github.run_number }}" tool/FileShareInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }
          if (-not (Test-Path dist/FileShare-Windows-Setup.exe)) { throw 'Windows installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-windows-installer
          path: dist/FileShare-Windows-Setup.exe
          if-no-files-found: error

  android_background_emulator:
    name: Verify Android background TCP receive and notification
    if: false # Windows installer only
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: file-share-background-emulator-apk
          path: emulator-apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real Android emulator and receive after Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r emulator-apk/app-debug.apk
            adb shell pm grant com.example.file_share android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.example.file_share/.MainActivity
            sleep 10
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell pidof com.example.file_share > screenshots/process-pid.txt || true
            adb shell dumpsys activity services com.example.file_share > screenshots/service-state.txt || true
            adb shell ss -tlpn > screenshots/tcp-listeners.txt || true
            adb logcat -c || true
            adb forward tcp:49311 tcp:49311
            python3 -c 'import json,socket; data=b"LAN background receiver test\n"; header=json.dumps({"protocol":"fileshare-file-v1","name":"lan_background_probe.txt","size":len(data),"batch":"background-check","sender":"GitHub runner","senderId":"runner-device"}).encode()+b"\n"; s=socket.create_connection(("127.0.0.1",49311),timeout=12); s.settimeout(20); s.sendall(header+data); reply=s.recv(64); print("Background receiver response:",repr(reply)); open("screenshots/transfer-result.txt","w").write(("PASS" if reply.startswith(b"OK") else "FAIL")+": "+repr(reply)); s.close()'
            sleep 4
            adb logcat -d -v time > screenshots/android-logcat.txt || true
            adb shell dumpsys notification --noredact > screenshots/notification-diagnostics.txt
            adb exec-out screencap -p > screenshots/01-android-after-background-receive.png
            adb shell cmd statusbar expand-notifications
            sleep 2
            adb exec-out screencap -p > screenshots/02-file-received-notification.png
            grep -F 'lan_background_probe.txt' screenshots/notification-diagnostics.txt || true
            grep -q '^PASS' screenshots/transfer-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-share-background-receive-proof
          path: screenshots/*
          if-no-files-found: warn

  publish_release:
    name: Publish Android ARM64 production-signed release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: file-share-android-signed-release-apk
          path: release
      - name: Publish tested signed Android APK only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          test -n "$version"
          test -s release/FileShare-Android-ARM64-Release.apk
          tag="fileshare-android-v${version}-build-${{ github.run_number }}"
          gh release create "$tag" release/FileShare-Android-ARM64-Release.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "File Share Android ARM64 Release" \
            --notes "Production-key signed ARM64-only Android release. Source: ${{ github.sha }}"
      - name: Publish SHA-256 metadata to repository manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          notes="$(git log -1 --pretty=%s)"
          python3 tool/publish_update_manifest.py android "$version" ${{ github.run_number }} \
            "fileshare-android-v${version}-build-${{ github.run_number }}" \
            release/FileShare-Android-ARM64-Release.apk "$notes"

  publish_windows_release:
    name: Publish Windows installer and update manifest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.windows.result == 'success'
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: file-share-windows-installer
          path: release
      - name: Publish validated Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          test -n "$version"
          test -s release/FileShare-Windows-Setup.exe
          tag="fileshare-windows-v${version}-build-${{ github.run_number }}"
          gh release create "$tag" release/FileShare-Windows-Setup.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "File Share Windows Installer" \
            --notes "Windows x64 Program Files installer. May request UAC. Source: ${{ github.sha }}"
      - name: Publish SHA-256 metadata to repository manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          notes="$(git log -1 --pretty=%s)"
          python3 tool/publish_update_manifest.py windows "$version" ${{ github.run_number }} \
            "fileshare-windows-v${version}-build-${{ github.run_number }}" \
            release/FileShare-Windows-Setup.exe "$notes"

  # Three platform releases from the same main commit in this one workflow run.
  ios_unsigned:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[mac-only]')
    name: iOS ONLY - macOS Xcode compile and IPA packaging
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Assert macOS and Xcode are available (never Windows)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS Runner from existing Flutter application
        run: |
          # Use the plugin's supported CocoaPods integration to avoid the
          # ONNX extensions SwiftPM binary host TLS failure. Never bypass TLS.
          flutter config --no-enable-swift-package-manager
          flutter config --enable-ios
          flutter create --platforms=ios --project-name file_share .
          python3 -m venv .ios-build-venv
          .ios-build-venv/bin/python -m pip install --quiet Pillow
          .ios-build-venv/bin/python tool/generate_brand_assets.py
          flutter pub get
          # iOS uses the verified Dart mobile enhancer; never fetch the unused
          # native ONNX binary from the broken TLS host.
          python3 tool/ios/isolate_unused_onnx_plugin.py
          flutter pub get
          python3 - <<'PY'
          import json
          data=json.load(open('.flutter-plugins-dependencies'))
          assert not any(p['name']=='flutter_onnxruntime'
                         for p in data['plugins'].get('ios',[])), (
              'Native ONNX iOS plugin must not reappear')
          print('iOS native ONNX plugin safely excluded')
          PY
          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then sudo gem install xcodeproj --no-document; fi
          python3 tool/ios/install_native_pdf.py
      - name: Verify iOS branded icon and source compatibility
        run: |
          set -euo pipefail
          test -s ios/Runner/Assets.xcassets/AppIcon.appiconset/fs-store.png
          test -s ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -s ios/Runner/FileShareIOSPDF.swift
          grep -q 'FileShareIOSPDF.register' ios/Runner/AppDelegate.swift
          flutter analyze --no-fatal-infos --no-fatal-warnings
          # Hosted macOS CI cannot route UDP broadcasts used by LAN integration tests.
          # Run every non-network-focused test here; LAN end-to-end is tested
          # in the Android/Windows validation workflow.
          tests=()
          while IFS= read -r file; do tests+=("$file"); done < <(find test -name '*_test.dart' ! -name 'widget_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"
      - name: Configure minimum iOS, privacy and local network usage
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, re
          root=pathlib.Path('ios')
          podfile=root/'Podfile'
          text=podfile.read_text()
          text=re.sub(r"^#?\s*platform\s*:ios,\s*'[^']+'",
                      "platform :ios, '16.0'",text,flags=re.M)
          if "platform :ios" not in text:
              text="platform :ios, '16.0'\n"+text
          # ONNX Runtime iOS CocoaPods requires static framework linkage.
          if "use_frameworks! :linkage => :static" not in text:
              text=text.replace("target 'Runner' do", "target 'Runner' do\n  use_frameworks! :linkage => :static",1)
          assert "use_frameworks! :linkage => :static" in text
          podfile.write_text(text)
          project=root/'Runner.xcodeproj/project.pbxproj'
          pbx=project.read_text()
          pbx=re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
                     'IPHONEOS_DEPLOYMENT_TARGET = 16.0;',pbx)
          pbx=pbx.replace('com.example.fileShare','com.syncstudiolan.fileshare')
          pbx=pbx.replace('com.example.file_share','com.syncstudiolan.fileshare')
          project.write_text(pbx)
          info=root/'Runner/Info.plist'
          with info.open('rb') as handle:
              data=plistlib.load(handle)
          data.update({
              'NSCameraUsageDescription':'Capture photos and files to share.',
              'NSMicrophoneUsageDescription':'Record videos shared by the user.',
              'NSPhotoLibraryUsageDescription':'Choose photos to edit and share.',
              'NSPhotoLibraryAddUsageDescription':'Save edited photos and files.',
              'NSLocalNetworkUsageDescription':'Discover nearby File Share devices and transfer files over LAN.',
              'NSBonjourServices':['_fileshare._tcp'],
              'NSFaceIDUsageDescription':'Unlock securely stored File Share credentials.',
          })
          with info.open('wb') as handle:
              plistlib.dump(data,handle)
          PY
      - name: Resolve iOS CocoaPods without unused ONNX native binary
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          test -f Podfile.lock
          if grep -Eq 'onnxruntime-(c|objc|extensions)' Podfile.lock; then
            echo "Unexpected ONNX iOS CocoaPods dependency remains"
            exit 1
          fi
      - name: Build Release for real iPhone without developer certificate
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          flutter build ios --release --no-codesign \
            --tree-shake-icons --obfuscate \
            --split-debug-info=build/ios-symbols \
            --build-name="$version" --build-number="${{ github.run_number }}" \
            --dart-define=FILE_SHARE_VERSION="$version" \
            --dart-define=FILE_SHARE_BUILD_NUMBER="${{ github.run_number }}"
      - name: Assemble unsigned IPA (requires signing before installation)
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          test -s "$app/Runner"
          mkdir -p Payload release
          ditto "$app" Payload/Runner.app
          zip -qry release/FileShare-iOS-UNSIGNED.ipa Payload
          unzip -tq release/FileShare-iOS-UNSIGNED.ipa
          file "$app/Runner"
          python3 - <<'PY'
          import os
          path='release/FileShare-iOS-UNSIGNED.ipa'
          print('Unsigned iOS IPA size:',round(os.path.getsize(path)/1048576,2),'MiB')
          assert os.path.getsize(path)<300*1048576, 'iOS package too large'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-ios-unsigned-ipa
          path: release/FileShare-iOS-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 30
      # The standalone DMG workflow remained queued and was cancelled before
      # any build steps ran. Reuse this already-allocated Apple Silicon runner
      # (the same macOS runner that successfully compiled the iPhone IPA).
      # No second macOS job is requested.
      - name: Prepare macOS ARM64 app on the existing iOS macOS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          echo "Building macOS DMG on $(uname -m) / $(sw_vers -productVersion)"
          flutter config --enable-macos-desktop
          # CocoaPods supports ONNX Runtime on macOS and avoids the generated
          # Swift Package Manager target stuck at macOS 12 in prior builds.
          flutter config --no-enable-swift-package-manager
          flutter create --project-name file_share --platforms=macos .
          .ios-build-venv/bin/python tool/prepare_macos_tray_runner.py
          flutter pub get
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('macos')
          project=root/'Runner.xcodeproj/project.pbxproj'
          contents=project.read_text()
          updated,n=re.subn(r'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;',
                            'MACOSX_DEPLOYMENT_TARGET = 14.0;',contents)
          if not n:
              raise SystemExit('Cannot locate macOS Runner deployment target')
          project.write_text(updated)
          podfile=root/'Podfile'
          contents=podfile.read_text()
          contents,n=re.subn(r"^#?\s*platform\s*:osx,\s*'[^']+'",
                             "platform :osx, '14.0'",contents,flags=re.M)
          if not n:
              contents="platform :osx, '14.0'\n"+contents
          podfile.write_text(contents)
          package=root/'Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift'
          if package.is_file():
              contents=package.read_text()
              contents,n=re.subn(r'\.macOS\("[0-9.]+"\)',
                                 '.macOS("14.0")',contents)
              if n: package.write_text(contents)
          print('macOS minimum deployment target: 14.0')
          PY
      - name: Compile Apple Silicon and create DMG
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$app" && test -d "$app"
          executable="$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -1)"
          test -n "$executable"
          lipo -info "$executable"
          lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64
          mkdir -p release/macos-dmg-root
          ditto "$app" "release/macos-dmg-root/File Share.app"
          ln -s /Applications release/macos-dmg-root/Applications
          hdiutil create -volname "File Share" -srcfolder release/macos-dmg-root \
            -ov -format UDZO release/FileShare-macOS-AppleSilicon.dmg
          test -s release/FileShare-macOS-AppleSilicon.dmg
          shasum -a 256 release/FileShare-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-macos-arm64-dmg
          path: release/FileShare-macOS-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest Apple Silicon DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="fileshare-macos-arm64-${GITHUB_SHA:0:8}"
          gh release create "$tag" release/FileShare-macOS-AppleSilicon.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "File Share macOS Apple Silicon DMG" \
            --notes "ARM64 macOS 14+ build from latest main including PR #19. Unsigned and unnotarized; Gatekeeper approval may be required. LAN discovery, auto-start and folder access require real-device validation." \
            --prerelease

  publish_ipa:
    name: iOS ONLY - Publish unsigned IPA for external signing
    needs: [ios_unsigned]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: file-share-ios-unsigned-ipa
          path: release
      - name: Create iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/FileShare-iOS-UNSIGNED.ipa
          gh release create "fileshare-ios-unsigned-build-${{ github.run_number }}" \
            release/FileShare-iOS-UNSIGNED.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "File Share iOS unsigned IPA" \
            --notes "UNSIGNED: must be signed with an appropriate Apple certificate/provisioning profile before installing on iPhone. Android-only native PDF tools do not run on iOS."
      - name: Publish unsigned iOS update-check manifest (sign externally in AppleJR)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          test -s release/FileShare-iOS-UNSIGNED.ipa
          python3 tool/publish_update_manifest.py ios "$version" ${{ github.run_number }} \
            "fileshare-ios-unsigned-build-${{ github.run_number }}" \
            release/FileShare-iOS-UNSIGNED.ipa "Unsigned iOS release — re-sign with AppleJR using the original certificate/profile and bundle ID."

