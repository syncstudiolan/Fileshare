name: Validate File Share background LAN and compact releases

on:
  # Android test build on the explicitly requested merge into main.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping validations when multiple source fixes are pushed.
concurrency:
  group: fileshare-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview_validation:
    # Before merging PR #6, run actual analyzer/tests/Android compilation.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner for plugin analyzer
        run: flutter create --project-name file_share --platforms=android .
      - name: Verify ML Kit release rules
        run: python3 tool/ensure_mlkit_proguard.py
      - run: flutter pub get
      - name: Repair upstream WebView ProGuard configuration for AGP 9
        run: python3 tool/fix_legacy_inappwebview_gradle.py
      - name: Analyze all Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Toolbox UI and image processing regression tests
        run: flutter test
      - name: Compile upstream native Android PDF Tools and scanner
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain
      - name: Verify the original 24-tool Kotlin registry on JVM
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build File Share Android PDF Tools test APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify test APK debug signature
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android PDF Tools test APK
        uses: actions/upload-artifact@v4
        with:
          name: file-share-pdf-tools-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing Android runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Configure Android release ML Kit keep rules
        run: python3 tool/ensure_mlkit_proguard.py
      - name: Install packages
        run: flutter pub get
      - name: Repair upstream WebView ProGuard configuration for AGP 9
        run: python3 tool/fix_legacy_inappwebview_gradle.py
      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and LAN model tests
        run: flutter test
      - name: Central Directory contract tests
        run: node --test directory/worker.test.mjs
      - name: Live Cloudflare auth route smoke checks (no real credentials)
        shell: bash
        run: |
          set -euo pipefail
          directory='https://fileshare-directory.modeltech0.workers.dev'
          personal='https://fileshare-personal-7ee7299b34.modeltech0.workers.dev'
          for endpoint in "$directory" "$personal"; do
            curl --fail --show-error --silent --retry 3 --retry-delay 2 \
              "$endpoint/health" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d"
          done
          code=$(curl -sS -o /tmp/directory-unknown-email.json -w '%{http_code}' \
            -X POST "$directory/v1/directory/resolve" \
            -H 'content-type: application/json' \
            --data '{"email":"nonexistent-smoke-test-835293@example.invalid"}')
          test "$code" = 404 || { echo "Directory resolve returned unexpected HTTP $code"; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/directory-unknown-email.json')); assert d.get('error') == 'Email address is not registered', d"
      - name: Configure stable production APK signing
        shell: bash
        env:
          SIGNED_KEYSTORE: ${{ secrets.FILE_SHARE_ANDROID_KEYSTORE_BASE64 }}
          SIGNED_STORE_PASSWORD: ${{ secrets.FILE_SHARE_ANDROID_KEYSTORE_PASSWORD }}
          SIGNED_KEY_ALIAS: ${{ secrets.FILE_SHARE_ANDROID_KEY_ALIAS }}
          SIGNED_KEY_PASSWORD: ${{ secrets.FILE_SHARE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNED_KEYSTORE" || -z "$SIGNED_STORE_PASSWORD" || -z "$SIGNED_KEY_ALIAS" || -z "$SIGNED_KEY_PASSWORD" ]]; then
            echo "::error::Configure FILE_SHARE_ANDROID_KEYSTORE_BASE64, FILE_SHARE_ANDROID_KEYSTORE_PASSWORD, FILE_SHARE_ANDROID_KEY_ALIAS, FILE_SHARE_ANDROID_KEY_PASSWORD as repository Actions secrets; production builds cannot use debug keys."
            exit 1
          fi
          printf %s "$SIGNED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/file-share-production.jks"
          echo "FILE_SHARE_KEYSTORE_FILE=$RUNNER_TEMP/file-share-production.jks" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEYSTORE_PASSWORD=$SIGNED_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEY_ALIAS=$SIGNED_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FILE_SHARE_KEY_PASSWORD=$SIGNED_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build compact ARM64 production release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/obfuscation-symbols
      - name: Verify signing, installable package and ARM64-only native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          python3 - "$apk" <<'PY'
          import zipfile, sys, os
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              libraries=[n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis=sorted({n.split('/')[1] for n in libraries})
              print('Native ABIs:', abis)
              assert abis == ['arm64-v8a'], f'Unexpected ABIs: {abis}'
          size=os.path.getsize(apk)
          print(f'APK size: {size/1048576:.1f} MiB')
          assert size < 160*1048576, 'APK exceeds 160 MiB test limit'
          PY
          cp "$apk" build/app/outputs/flutter-apk/FileShare-Android-ARM64-Release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-android-signed-release-apk
          path: build/app/outputs/flutter-apk/FileShare-Android-ARM64-Release.apk
          if-no-files-found: error
      - name: Build special full-backend emulator-only debug APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --dart-define=FILE_SHARE_BACKGROUND_VALIDATION=true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: file-share-background-emulator-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request'
    needs: android
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - name: Generate missing Windows runner
        run: flutter create --project-name file_share --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build optimized Windows release bundle
        run: flutter build windows --release
      - name: Record Windows release bundle size
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $bytes = (Get-ChildItem $bundle -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Windows release bundle size: $bytes bytes"
          Get-ChildItem $bundle -File | Select-Object Name,Length
      - name: Run real Windows EXE hidden and transfer a file by TCP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path "build/windows/x64/runner/Release").Path
          $exe = Join-Path $folder "file_share.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--lan-smoke", "--background" -WorkingDirectory $folder -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Windows EXE exited with code $($proc.ExitCode)" }
              $port = Get-NetTCPConnection -LocalPort 49311 -State Listen -ErrorAction SilentlyContinue
              if ($port) { $ready = $true; break }
            }
            if (-not $ready) { throw "Windows LAN TCP listener did not start" }
            $payload = "Windows background LAN transfer proof"
            $header = '{"protocol":"fileshare-file-v1","name":"windows_smoke.txt","size":' +
              [Text.Encoding]::UTF8.GetByteCount($payload) +
              ',"batch":"win-smoke","sender":"Windows GitHub CI","senderId":"windows-ci"}'
            $bytes = [Text.Encoding]::UTF8.GetBytes($header + [char]10 + $payload)
            $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", 49311)
            try {
              $client.ReceiveTimeout = 20000
              $stream = $client.GetStream()
              $stream.Write($bytes,0,$bytes.Length)
              $stream.Flush()
              $buffer = New-Object byte[] 64
              $read = $stream.Read($buffer,0,$buffer.Length)
              $ack = [Text.Encoding]::UTF8.GetString($buffer,0,$read)
              Write-Host "Real Windows LAN receiver ACK: $ack"
              if (-not $ack.StartsWith("OK")) { throw "Windows receiver did not persist the file" }
              $proc.Refresh()
              if ($proc.HasExited) { throw "Windows receiver exited instead of running in background" }
              Write-Host "PASS: Windows release EXE live in background and LAN TCP ACK received."
            } finally { $client.Dispose() }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installable Program Files setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc tool/FileShareInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }
          if (-not (Test-Path dist/FileShare-Windows-Setup.exe)) { throw 'Windows installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-windows-installer
          path: dist/FileShare-Windows-Setup.exe
          if-no-files-found: error

  android_background_emulator:
    name: Verify Android background TCP receive and notification
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: file-share-background-emulator-apk
          path: emulator-apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real Android emulator and receive after Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r emulator-apk/app-debug.apk
            adb shell pm grant com.example.file_share android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.example.file_share/.MainActivity
            sleep 10
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell pidof com.example.file_share > screenshots/process-pid.txt || true
            adb shell dumpsys activity services com.example.file_share > screenshots/service-state.txt || true
            adb shell ss -tlpn > screenshots/tcp-listeners.txt || true
            adb logcat -c || true
            adb forward tcp:49311 tcp:49311
            python3 -c 'import json,socket; data=b"LAN background receiver test\n"; header=json.dumps({"protocol":"fileshare-file-v1","name":"lan_background_probe.txt","size":len(data),"batch":"background-check","sender":"GitHub runner","senderId":"runner-device"}).encode()+b"\n"; s=socket.create_connection(("127.0.0.1",49311),timeout=12); s.settimeout(20); s.sendall(header+data); reply=s.recv(64); print("Background receiver response:",repr(reply)); open("screenshots/transfer-result.txt","w").write(("PASS" if reply.startswith(b"OK") else "FAIL")+": "+repr(reply)); s.close()'
            sleep 4
            adb logcat -d -v time > screenshots/android-logcat.txt || true
            adb shell dumpsys notification --noredact > screenshots/notification-diagnostics.txt
            adb exec-out screencap -p > screenshots/01-android-after-background-receive.png
            adb shell cmd statusbar expand-notifications
            sleep 2
            adb exec-out screencap -p > screenshots/02-file-received-notification.png
            grep -F 'lan_background_probe.txt' screenshots/notification-diagnostics.txt || true
            grep -q '^PASS' screenshots/transfer-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-share-background-receive-proof
          path: screenshots/*
          if-no-files-found: warn

  publish_release:
    name: Publish Android + Windows installer release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: file-share-android-signed-release-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: file-share-windows-installer
          path: release
      - name: Create versioned GitHub release with both packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/FileShare-Android-ARM64-Release.apk
          test -s release/FileShare-Windows-Setup.exe
          tag="fileshare-v0.1.0-build-${{ github.run_number }}"
          gh release create "$tag" release/FileShare-Android-ARM64-Release.apk release/FileShare-Windows-Setup.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "File Share Android ARM64 and Windows Installer" \
            --notes "Android production-key signed ARM64 APK and Windows Program Files setup (Inno Setup). Source: ${{ github.sha }}."
