name: Validate offline LAN fixes on Android and Windows

on:
  push:
    branches: [offline-lan-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing Android runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Get packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-offline-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - name: Generate missing Windows runner
        run: flutter create --project-name file_share --platforms=windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: file-share-offline-windows-debug
          path: build/windows/x64/runner/Debug/**
          if-no-files-found: error
