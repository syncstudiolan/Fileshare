name: Android device test APK

on:
  push:
    branches:
      - android-device-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing Android runner files
        run: flutter create --project-name file_share --platforms=android .
      - name: Install packages
        run: flutter pub get
      - name: Analyze Dart for compilation errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter widget tests
        run: flutter test
      - name: Build regular Android debug APK (real LAN backend enabled)
        run: flutter build apk --debug
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: file-share-android-device-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
