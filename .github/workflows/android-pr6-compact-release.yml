name: Android PR6 compact signed test release

on:
  push:
    branches:
      - draft/live-scanner-smooth-editor-tools
    paths:
      - ".github/workflows/android-pr6-compact-release.yml"
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "test/**"

permissions:
  contents: write

concurrency:
  group: android-pr6-compact-release
  cancel-in-progress: false

jobs:
  build_android:
    name: Validate and produce one ARM64 Android test release
    if: contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android Flutter runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Ensure Android ML Kit and R8 keep rules
        run: python3 tool/ensure_mlkit_proguard.py
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter regression tests
        run: flutter test
      - name: Native Kotlin tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build compressed ARM64 test release APK
        run: >
          flutter build apk --release --target-platform android-arm64
          --obfuscate --split-debug-info=build/release-symbols --tree-shake-icons
      - name: Verify signature, ABI, and report real size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk"
          python3 - "$apk" <<'PY'
          import os,sys,zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
          print('Native ABIs:',abis)
          assert abis==['arm64-v8a'], 'Non ARM64 ABIs bundled: '+repr(abis)
          total=os.path.getsize(apk)/1048576
          print('SIGNED APK SIZE: %.2f MiB'%total)
          print('UNDER 100 MiB TARGET:',total<100)
          PY
          mkdir -p artifacts
          cp "$apk" artifacts/FileShare-Android-ARM64-PR6-Signed.apk
          echo "size_bytes=$(stat -c %s "$apk")" >> "$GITHUB_OUTPUT"
      - name: Upload one signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileShare-Android-ARM64-PR6-Signed
          path: artifacts/FileShare-Android-ARM64-PR6-Signed.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub prerelease test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="fileshare-android-pr6-${GITHUB_SHA:0:8}"
          gh release create "$tag" artifacts/FileShare-Android-ARM64-PR6-Signed.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "File Share Android ARM64 PR6 Test Build" \
            --notes "Signed ARM64 testing APK from Draft PR #6. Release-mode, minified, resource-shrunk, and obfuscated; debug signing key and .testing application ID. Install as a separate testing app. Functionality still requires user device acceptance." \
            --prerelease
