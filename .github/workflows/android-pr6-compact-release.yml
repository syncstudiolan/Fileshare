name: Android latest ARM64 APK release

# Android-only release requested after PR #18 merge.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-pr6-compact-release.yml'
      - 'test/photo_enhancer_preflight_test.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/drawable/**'
      - 'android/app/src/main/res/drawable-v21/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-pr6-compact-release
  cancel-in-progress: false

jobs:
  build_android:
    name: Validate and produce one ARM64 Android test release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android Flutter runner
        run: flutter create --project-name file_share --platforms=android .
      - name: Ensure Android ML Kit and R8 keep rules
        run: python3 tool/ensure_mlkit_proguard.py
      - name: Resolve Dart packages
        run: flutter pub get
      - name: Fix legacy InAppWebView ProGuard configuration for AGP 9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=list((Path.home()/'.pub-cache/hosted/pub.dev').glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not files:
              raise SystemExit('Expected flutter_inappwebview_android Gradle file not found')
          for path in files:
              content=path.read_text()
              old="getDefaultProguardFile('proguard-android.txt')"
              if old in content:
                  path.write_text(content.replace(old,"getDefaultProguardFile('proguard-android-optimize.txt')"))
                  print('Patched obsolete ProGuard default in',path)
              elif "proguard-android-optimize.txt" not in content:
                  raise SystemExit('Unknown plugin ProGuard configuration: '+str(path))
          PY
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter regression tests
        run: flutter test
      - name: Native Kotlin tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build ARM64 debug-signed test APK
        run: >
          flutter build apk --debug --target-platform android-arm64
      - name: Verify signature, ABI, and report real size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk"
          python3 - "$apk" <<'PY'
          import os,sys,zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
          print('Native ABIs:',abis)
          assert abis==['arm64-v8a'], 'Non ARM64 ABIs bundled: '+repr(abis)
          total=os.path.getsize(apk)/1048576
          print('SIGNED APK SIZE: %.2f MiB'%total)
          print('UNDER 100 MiB TARGET:',total<100)
          PY
          mkdir -p artifacts
          cp "$apk" artifacts/FileShare-Android-Latest-ARM64-Debug-Test.apk
          echo "size_bytes=$(stat -c %s "$apk")" >> "$GITHUB_OUTPUT"
      - name: Upload one signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileShare-Android-Latest-ARM64-Debug-Test
          path: artifacts/FileShare-Android-Latest-ARM64-Debug-Test.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub prerelease test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="fileshare-android-debug-test-${GITHUB_SHA:0:8}"
          gh release create "$tag" artifacts/FileShare-Android-Latest-ARM64-Debug-Test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "File Share Android ARM64 Debug Test Build" \
            --notes "ARM64 debug-signed test APK from latest main after PR #18. NOT production signed or an in-place update to an existing production installation. Production signing key is missing." \
            --prerelease
