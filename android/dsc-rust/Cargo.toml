[package]
name = "fileshare-dsc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
name = "fileshare_dsc"
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
serde_json = "1"
sha2 = "0.10"
pdfcraft-sign = { git = "https://github.com/storytold/pdfcraft", rev = "6e910675c68dd5092e889065cfe8d0274c1b2742" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "6e910675c68dd5092e889065cfe8d0274c1b2742" }

[profile.release]
lto = "thin"
strip = true
panic = "unwind"
